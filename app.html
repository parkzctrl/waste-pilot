<title>WastePilot — Operations OS for Waste Management</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#F1F1EE; --surface-3:#EAEAE6;
  --border:#E4E4DF; --border-strong:#D3D3CC;
  --text:#1A1B18; --text-2:#5D5F58; --text-3:#8F918A;
  --accent:#E19A2F; --accent-strong:#9A6510; --accent-ink:#221604; --accent-soft:rgba(214,146,38,.11);
  --good:#177E3E; --good-soft:rgba(23,126,62,.10);
  --warn:#9A6510; --warn-soft:rgba(214,146,38,.13);
  --danger:#C13538; --danger-soft:rgba(193,53,56,.09);
  --info:#2A6FBF; --info-soft:rgba(42,111,191,.09);
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300; --s5:#4a3aa7;
  --grid:#ECECE7; --axis:#C9C9C2;
  --shadow:0 1px 2px rgba(20,20,15,.05),0 4px 16px rgba(20,20,15,.06);
  --shadow-lg:0 4px 12px rgba(20,20,15,.08),0 16px 48px rgba(20,20,15,.14);
  --font:-apple-system,"SF Pro Text",BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
  --r-card:10px; --r-ctl:7px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E0F11; --surface:#16181B; --surface-2:#1C1F23; --surface-3:#23262B;
  --border:#26292E; --border-strong:#353941;
  --text:#ECEDEE; --text-2:#A3A8AE; --text-3:#6E747B;
  --accent:#E8A33B; --accent-strong:#F0B45C; --accent-ink:#221604; --accent-soft:rgba(232,163,59,.13);
  --good:#4CC076; --good-soft:rgba(76,192,118,.12);
  --warn:#E8A33B; --warn-soft:rgba(232,163,59,.14);
  --danger:#E5666A; --danger-soft:rgba(229,102,106,.12);
  --info:#6BA6E8; --info-soft:rgba(107,166,232,.12);
  --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300; --s5:#9085e9;
  --grid:#22252A; --axis:#3A3E45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 64px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0E0F11; --surface:#16181B; --surface-2:#1C1F23; --surface-3:#23262B;
  --border:#26292E; --border-strong:#353941;
  --text:#ECEDEE; --text-2:#A3A8AE; --text-3:#6E747B;
  --accent:#E8A33B; --accent-strong:#F0B45C; --accent-ink:#221604; --accent-soft:rgba(232,163,59,.13);
  --good:#4CC076; --good-soft:rgba(76,192,118,.12);
  --warn:#E8A33B; --warn-soft:rgba(232,163,59,.14);
  --danger:#E5666A; --danger-soft:rgba(229,102,106,.12);
  --info:#6BA6E8; --info-soft:rgba(107,166,232,.12);
  --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300; --s5:#9085e9;
  --grid:#22252A; --axis:#3A3E45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 64px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#F1F1EE; --surface-3:#EAEAE6;
  --border:#E4E4DF; --border-strong:#D3D3CC;
  --text:#1A1B18; --text-2:#5D5F58; --text-3:#8F918A;
  --accent:#E19A2F; --accent-strong:#9A6510; --accent-ink:#221604; --accent-soft:rgba(214,146,38,.11);
  --good:#177E3E; --good-soft:rgba(23,126,62,.10);
  --warn:#9A6510; --warn-soft:rgba(214,146,38,.13);
  --danger:#C13538; --danger-soft:rgba(193,53,56,.09);
  --info:#2A6FBF; --info-soft:rgba(42,111,191,.09);
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300; --s5:#4a3aa7;
  --grid:#ECECE7; --axis:#C9C9C2;
  --shadow:0 1px 2px rgba(20,20,15,.05),0 4px 16px rgba(20,20,15,.06);
  --shadow-lg:0 4px 12px rgba(20,20,15,.08),0 16px 48px rgba(20,20,15,.14);
}
/* ============ BASE ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:13px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}
::selection{background:var(--accent-soft)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mut{color:var(--text-2)}.mut3{color:var(--text-3)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ APP FRAME ============ */
.app{display:grid;grid-template-columns:228px 1fr;height:100vh}
@media (max-width:900px){.app{grid-template-columns:64px 1fr}.side .lbl,.side .brand-name,.side .grp,.side .badge,.side .user-meta,.side .search-btn span,.side .search-btn .kbd{display:none}.side .search-btn{justify-content:center}}
.side{background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:10px 8px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 12px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));display:grid;place-items:center;color:var(--accent-ink);flex-shrink:0}
.brand-name{font-weight:650;font-size:13.5px;letter-spacing:-.01em}
.brand-name small{display:block;font-size:10px;font-weight:500;color:var(--text-3);letter-spacing:.02em}
.search-btn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-3);font-size:12.5px;margin-bottom:10px;transition:border-color .12s}
.search-btn:hover{border-color:var(--border-strong)}
.search-btn .kbd{margin-left:auto}
.kbd{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface-2)}
.grp{padding:12px 8px 4px}
nav.sidenav{display:flex;flex-direction:column;gap:1px}
.nav-it{display:flex;align-items:center;gap:9px;padding:5.5px 8px;border-radius:6px;color:var(--text-2);font-size:12.5px;font-weight:500;width:100%;text-align:left;transition:background .1s,color .1s;position:relative}
.nav-it svg{color:var(--text-3);transition:color .1s}
.nav-it:hover{background:var(--surface-2);color:var(--text)}
.nav-it.on{background:var(--accent-soft);color:var(--text)}
.nav-it.on svg{color:var(--accent-strong)}
.nav-it .badge{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--surface-2);border-radius:99px;padding:0 6px;font-family:var(--mono)}
.nav-it.on .badge{background:var(--accent-soft);color:var(--accent-strong)}
.side-user{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer}
.side-user:hover{background:var(--surface-2)}
.user-meta{min-width:0}
.user-meta b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta span{font-size:11px;color:var(--text-3)}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:650;color:#fff;flex-shrink:0}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:50px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:-.01em}
.crumb .sep{color:var(--text-3);font-weight:400}
.crumb .parent{color:var(--text-3);font-weight:500;cursor:pointer}
.crumb .parent:hover{color:var(--text)}
.topbar .spacer{flex:1}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--text-2);transition:background .1s;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.page{padding:22px 26px 48px;max-width:1240px;margin:0 auto;animation:pagein .18s ease}
.page.wide{max-width:none}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:19px;font-weight:650}
.page-head .sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5.5px 12px;border-radius:var(--r-ctl);font-size:12.5px;font-weight:550;border:1px solid transparent;transition:all .12s;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn-pri{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn-pri:hover{filter:brightness(1.05)}
.btn-sec{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:0 1px 2px rgba(20,20,15,.04)}
.btn-sec:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:3.5px 9px;font-size:12px}
.input,.select,textarea.input{width:100%;padding:6.5px 10px;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface);font-size:12.5px;transition:border-color .12s;color:var(--text)}
.input:hover,.select:hover{border-color:var(--border-strong)}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--text-3)}
label.fld{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field{margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1.5px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neu{background:var(--surface-2);color:var(--text-2)}
.pill.plain::before{display:none}
.tag{display:inline-flex;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:550;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 1px 2px rgba(20,20,15,.03)}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:13px;font-weight:600}
.card-h .rt{margin-left:auto;display:flex;align-items:center;gap:6px}
.card-b{padding:14px 16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:7px 12px;font-size:12.5px;font-weight:550;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:6px;font-size:12px;font-weight:550;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,20,15,.08)}
.switch{position:relative;width:32px;height:18px;border-radius:99px;background:var(--border-strong);transition:background .15s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(14px)}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .08s;cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl th.r{text-align:right}
.cell-main{font-weight:550}
.cell-sub{font-size:11.5px;color:var(--text-3)}

/* ============ DASHBOARD ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:13px 15px;position:relative;transition:border-color .15s}
.kpi:hover{border-color:var(--border-strong)}
.kpi .k-lbl{font-size:11.5px;font-weight:550;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:5px;display:flex;align-items:baseline;gap:8px}
.kpi .k-delta{font-size:11px;font-weight:600}
.kpi .k-delta.up{color:var(--good)}.kpi .k-delta.down{color:var(--danger)}
.kpi .k-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.kpi .spark{position:absolute;right:12px;bottom:12px;opacity:.9}
.dash-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.widget{position:relative}
.widget[draggable=true]{cursor:default}
.widget .drag-h{position:absolute;top:9px;right:10px;color:var(--text-3);opacity:0;transition:opacity .12s;cursor:grab;padding:3px;border-radius:5px;z-index:2}
.widget:hover .drag-h{opacity:1}
.widget .drag-h:hover{background:var(--surface-2)}
.widget.dragging{opacity:.4}
.widget.dropover{outline:2px dashed var(--accent);outline-offset:2px;border-radius:var(--r-card)}
.w-3{grid-column:span 3}.w-2{grid-column:span 2}.w-4{grid-column:span 4}.w-6{grid-column:span 6}
@media (max-width:1100px){.w-2,.w-3,.w-4{grid-column:span 6}}
.list-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);font-size:12.5px;transition:background .08s;cursor:pointer}
.list-row:hover{background:var(--surface-2)}
.list-row:last-child{border-bottom:none}
.list-row .t{min-width:0;flex:1}
.list-row .t b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .t span{font-size:11.5px;color:var(--text-3)}
.time-chip{font-family:var(--mono);font-size:11px;color:var(--text-2);background:var(--surface-2);border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.ai-card{border:1px solid var(--border);border-radius:var(--r-card);background:linear-gradient(160deg,var(--accent-soft),transparent 55%),var(--surface)}
.ai-strip{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.ai-strip:last-child{border-bottom:none}
.ai-strip .ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.ai-strip p{font-size:12.5px}
.ai-strip .why{font-size:11.5px;color:var(--text-3);margin-top:1px}
.ai-strip .act{margin-left:auto;flex-shrink:0}
.feed{padding:4px 0}
.feed-it{display:flex;gap:10px;padding:7px 16px;font-size:12px}
.feed-it .fdot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--text-3)}
.feed-it time{margin-left:auto;color:var(--text-3);font-family:var(--mono);font-size:10.5px;white-space:nowrap;flex-shrink:0}

/* ============ KANBAN ============ */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-card);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col-h{display:flex;align-items:center;gap:7px;padding:10px 12px;font-size:12px;font-weight:600}
.col-h .cnt{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.col-b{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.col.dropover{border-color:var(--accent);background:var(--accent-soft)}
.jcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 11px;cursor:grab;box-shadow:0 1px 2px rgba(20,20,15,.04);transition:border-color .12s,transform .12s}
.jcard:hover{border-color:var(--border-strong)}
.jcard.dragging{opacity:.4;transform:rotate(2deg)}
.jcard .jc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.jcard .jc-id{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.jcard b{font-size:12.5px;font-weight:550;display:block}
.jcard .jc-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--text-3)}

/* ============ SCHEDULER ============ */
.sched{border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);overflow-x:auto}
.sched-inner{min-width:980px}
.sched-row{display:grid;grid-template-columns:170px repeat(10,1fr);border-bottom:1px solid var(--border)}
.sched-row:last-child{border-bottom:none}
.sched-row.head{position:sticky;top:0;background:var(--surface);z-index:2}
.sched-row.head>div{padding:8px 10px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);border-left:1px solid var(--border);font-family:var(--mono)}
.sched-row.head>div:first-child{border-left:none}
.sched-driver{padding:10px 12px;display:flex;gap:9px;align-items:center;border-right:1px solid var(--border)}
.sched-driver .dm b{display:block;font-size:12.5px;font-weight:600}
.sched-driver .dm span{font-size:11px;color:var(--text-3)}
.sched-cells{grid-column:2/-1;position:relative;display:grid;grid-template-columns:repeat(10,1fr);min-height:58px}
.sched-cells>.cell{border-left:1px solid var(--grid)}
.sched-cells.dropover{background:var(--accent-soft)}
.chip{position:absolute;top:9px;height:40px;border-radius:7px;padding:4px 9px;font-size:11px;cursor:grab;border:1px solid;overflow:hidden;transition:filter .12s,box-shadow .12s}
.chip:hover{filter:brightness(1.03);box-shadow:var(--shadow);z-index:3}
.chip b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.chip span{opacity:.75;white-space:nowrap;font-size:10.5px}
.chip.c-col{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.chip.c-del{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.c-haz{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.chip.conflict{outline:2px solid var(--danger);outline-offset:1px}
.chip.dragging{opacity:.4}
.chip.pulse{animation:chippulse .8s ease 2}
@keyframes chippulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 6px var(--accent-soft)}}
.cap-bar{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:64px}

<script>
/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg, icon='check'){
  const t = document.createElement('div'); t.className='toast';
  t.innerHTML = `<span style="color:var(--good)">${ICONS[icon]||ICONS.check}</span>${msg}`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out'); setTimeout(()=>t.remove(),300)},3400);
}
function toggleTheme(){
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  drawRouteMaps();
}
function openModal(html){ $('#modal-body').innerHTML = html; $('#modal-overlay').classList.add('open'); }
function closeModal(){ $('#modal-overlay').classList.remove('open'); }
function toggleNotifs(e){
  e.stopPropagation();
  const p = $('#notif-pop');
  if(p.classList.contains('open')){ p.classList.remove('open'); return; }
  p.innerHTML = `<div class="card-h"><h3>Notifications</h3><div class="rt"><button class="btn btn-ghost btn-sm" onclick="$('#notif-pop').classList.remove('open');toast('All notifications cleared')">Mark all read</button></div></div>` +
    NOTIFS.map(n=>`<div class="notif-it"><div class="n-ico" style="background:var(--${n.tone==='bad'?'danger':n.tone}-soft);color:var(--${n.tone==='bad'?'danger':n.tone})">${ICONS[n.icon]}</div><div style="flex:1">${n.text}<div><time>${n.time} ago</time></div></div></div>`).join('');
  p.classList.add('open');
}
document.addEventListener('click', e=>{ if(!e.target.closest('.notif-pop')) $('#notif-pop').classList.remove('open'); });

/* Chart primitives */
function spark(pts, w=72, h=26, color='var(--s1)', fill=true){
  const mx=Math.max(...pts), mn=Math.min(...pts), r=mx-mn||1;
  const xy = pts.map((p,i)=>[i/(pts.length-1)*(w-4)+2, h-3-(p-mn)/r*(h-8)]);
  const d = xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = xy[xy.length-1];
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true">
    ${fill?`<path d="${d} L${last[0]} ${h-1} L2 ${h-1} Z" fill="${color}" opacity=".1"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}
function barChart(data, {h=170, color='var(--s1)', fmt=v=>money(v), unit=''}={}){
  const w=560, pad={l:6,r:6,t:14,b:22}, bw=(w-pad.l-pad.r)/data.length;
  const mx=Math.max(...data.map(d=>d.v))*1.12;
  const gl=[0,.25,.5,.75,1].map(f=>{const y=pad.t+(1-f)*(h-pad.t-pad.b);return `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`}).join('');
  const bars=data.map((d,i)=>{
    const bh=Math.max(3,d.v/mx*(h-pad.t-pad.b)), x=pad.l+i*bw+bw*.18, y=h-pad.b-bh;
    return `<g class="bar-g" data-tip="${esc(d.l)}${unit?' '+unit:''}|${esc(fmt(d.v))}">
      <rect x="${x}" y="${y}" width="${bw*.64}" height="${bh}" rx="4" fill="${d.c||color}" style="cursor:pointer"/>
      <rect x="${x}" y="${y+4}" width="${bw*.64}" height="${Math.max(0,bh-4)}" fill="${d.c||color}"/>
      <text x="${x+bw*.32}" y="${h-7}" text-anchor="middle" font-size="10" fill="var(--text-3)" font-family="var(--mono)">${esc(d.l)}</text>
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-height:${h}px" class="hoverchart">${gl}<line x1="${pad.l}" x2="${w-pad.r}" y1="${h-pad.b}" y2="${h-pad.b}" stroke="var(--axis)"/>${bars}</svg>`;
}
function lineChart(series, labels, {h=180, fmt=v=>money(v)}={}){
  const w=560, pad={l:8,r:8,t:14,b:22};
  const all=series.flatMap(s=>s.pts), mx=Math.max(...all)*1.08, mn=0;
  const X=i=>pad.l+i/(labels.length-1)*(w-pad.l-pad.r), Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(h-pad.t-pad.b);
  const gl=[0,.5,1].map(f=>{const y=pad.t+(1-f)*(h-pad.t-pad.b);return `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`}).join('');
  const paths=series.map(s=>{
    const d=s.pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    const last=s.pts.length-1;
    return `<path d="${d} L${X(last)} ${h-pad.b} L${X(0)} ${h-pad.b} Z" fill="${s.c}" opacity=".07"/>
      <path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${X(last)}" cy="${Y(s.pts[last])}" r="3" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join('');
  const dots=labels.map((l,i)=>`<g class="bar-g" data-tip="${esc(l)}|${series.map(s=>esc(s.n)+': '+esc(fmt(s.pts[i]))).join('&#10;')}"><rect x="${X(i)-bandW(labels,w,pad)/2}" y="${pad.t}" width="${bandW(labels,w,pad)}" height="${h-pad.t-pad.b}" fill="transparent" style="cursor:crosshair"/></g>`).join('');
  const ticks=labels.map((l,i)=>i%2?'':`<text x="${X(i)}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--text-3)" font-family="var(--mono)">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-height:${h}px" class="hoverchart">${gl}<line x1="${pad.l}" x2="${w-pad.r}" y1="${h-pad.b}" y2="${h-pad.b}" stroke="var(--axis)"/>${paths}${ticks}${dots}</svg>`;
}
function bandW(labels,w,pad){ return (w-pad.l-pad.r)/(labels.length-1); }
/* shared tooltip */
document.addEventListener('mousemove', e=>{
  const g = e.target.closest('.bar-g'); const tip = $('#chart-tip');
  if(g){ const [t,v]=g.dataset.tip.split('|');
    tip.innerHTML = `<span class="mut3">${t}</span><br><b>${v.replace(/\n/g,'<br>')}</b>`;
    tip.style.opacity=1; tip.style.left=Math.min(innerWidth-230,e.clientX+14)+'px'; tip.style.top=(e.clientY+12)+'px';
  } else tip.style.opacity=0;
});
function stackBar(parts){ // [{l,v,c}] -> stacked horizontal bar with 2px gaps + legend
  const total = parts.reduce((a,p)=>a+p.v,0);
  return `<div class="margin-viz" role="img" aria-label="${esc(parts.map(p=>p.l+' '+Math.round(p.v/total*100)+'%').join(', '))}">${parts.map(p=>`<i class="bar-g" data-tip="${esc(p.l)}|${Math.round(p.v/total*100)}% · ${money(p.v)}" style="width:${p.v/total*100}%;background:${p.c}"></i>`).join('')}</div>
  <div class="legend" style="margin-top:9px">${parts.map(p=>`<span><i style="background:${p.c}"></i>${esc(p.l)} <b class="num" style="color:var(--text)">${Math.round(p.v/total*100)}%</b></span>`).join('')}</div>`;
}

function wireDashDnd(){
  const grid = $('#dashgrid'); if(!grid) return;
  let src=null;
  grid.querySelectorAll('.widget').forEach(w=>{
    const h=w.querySelector('.drag-h');
    h.addEventListener('dragstart',e=>{src=w;w.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    h.addEventListener('dragend',()=>{src&&src.classList.remove('dragging');src=null;});
    w.addEventListener('dragover',e=>{e.preventDefault();if(w!==src)w.classList.add('dropover');});
    w.addEventListener('dragleave',()=>w.classList.remove('dropover'));
    w.addEventListener('drop',e=>{
      e.preventDefault(); w.classList.remove('dropover'); if(!src||w===src)return;
      const a=DASH_ORDER.indexOf(src.dataset.w), b=DASH_ORDER.indexOf(w.dataset.w);
      DASH_ORDER.splice(a,1); DASH_ORDER.splice(b,0,src.dataset.w);
      render(); toast('Dashboard layout saved');
    });
  });
}

let ROUTE_MODE = 0;
function routeMode(m,btn){ ROUTE_MODE=m; btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); drawRouteMaps(); }
function drawRouteMaps(){
  const cv=$('#routemap'); if(!cv) return;
  const css=getComputedStyle(document.documentElement);
  const W=cv.width=cv.parentElement.clientWidth*2; const H=cv.height=760; cv.style.height='380px';
  const ctx=cv.getContext('2d'); ctx.scale(1,1);
  const c=(v)=>css.getPropertyValue(v).trim();
  ctx.fillStyle=c('--surface-2'); ctx.fillRect(0,0,W,H);
  // faint road grid
  ctx.strokeStyle=c('--grid'); ctx.lineWidth=2;
  for(let x=40;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+30,H);ctx.stroke();}
  for(let y=30;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y-20);ctx.stroke();}
  const stops=[[.12,.7],[.2,.38],[.33,.55],[.42,.22],[.52,.62],[.6,.35],[.72,.5],[.8,.2],[.88,.62],[.3,.82],[.62,.8]];
  const tips=[[.47,.45],[.85,.85]];
  const P=(p)=>[p[0]*W,p[1]*H];
  const cur=[0,9,2,4,1,3,5,10,6,8,7]; // meandering
  const ai=[1,3,5,7,6,8,10,4,2,9,0]; // smoother
  function drawPath(order,color,alpha,dash){
    ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=5; ctx.lineJoin='round'; if(dash)ctx.setLineDash([12,10]);
    ctx.beginPath(); order.forEach((s,i)=>{const[x,y]=P(stops[s]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke(); ctx.restore();
  }
  if(ROUTE_MODE===0){ drawPath(cur,c('--text-3'),.85,false); drawPath(ai,c('--accent'),.25,true); }
  else { drawPath(cur,c('--text-3'),.22,true); drawPath(ai,c('--accent'),.95,false); }
  stops.forEach((s,i)=>{const[x,y]=P(s); ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fillStyle=c('--surface'); ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=ROUTE_MODE?c('--accent'):c('--text-2'); ctx.stroke();});
  tips.forEach(t=>{const[x,y]=P(t); ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4); ctx.fillStyle=c('--danger'); ctx.fillRect(-8,-8,16,16); ctx.restore();});
}

function askAI(key){
  const c=CANNED[key];
  CHAT.push({role:'user',text:c.q},{role:'ai',text:'',thinking:true}); render(); scrollAssist();
  setTimeout(()=>{ CHAT.pop(); CHAT.push({role:'ai',text:c.a()}); render(); scrollAssist(); },1000);
}
function askFree(v){
  v=(v||'').trim(); if(!v) return;
  const key = Object.keys(CANNED).find(k=>v.toLowerCase().includes(k)) ||
    (v.toLowerCase().includes('invoice')?'unpaid':v.toLowerCase().includes('quote')?'quote':v.toLowerCase().includes('driver')?'drivers':null);
  if(key){ const c=CANNED[key]; CHAT.push({role:'user',text:esc(v)},{role:'ai',text:'',thinking:true}); render(); scrollAssist();
    setTimeout(()=>{CHAT.pop();CHAT.push({role:'ai',text:c.a()});render();scrollAssist();},1000); return; }
  CHAT.push({role:'user',text:esc(v)},{role:'ai',text:'',thinking:true}); render(); scrollAssist();
  setTimeout(()=>{ CHAT.pop(); CHAT.push({role:'ai',text:`In the full product I'd answer that against your live data. This prototype has canned answers for the example commands — try one of the chips, e.g. <b>"${CANNED.issues.q}"</b>.`}); render(); scrollAssist(); },800);
}
function scrollAssist(){ const v=$('#view'); if(v) v.scrollTop=v.scrollHeight; }

      <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill good">Completed</span><span class="pill info">In progress</span><span class="pill warn">Unassigned</span><span class="pill bad">Overdue</span><span class="pill neu">Draft</span><span class="tag">Mixed construction</span><span class="kbd">⌘K</span></div>
      <input class="input" placeholder="Input — focus ring uses the accent at 3px, 12% alpha" style="max-width:340px">
      <div style="display:flex;gap:10px;align-items:center"><button class="switch on" onclick="this.classList.toggle('on')"></button><span class="mut" style="font-size:12px">Switch — instant, no confirmation for reversible actions</span></div>
      <div style="max-width:340px"><div class="skeleton" style="height:13px;width:70%;margin-bottom:7px"></div><div class="skeleton" style="height:13px;width:45%"></div><p class="mut3" style="font-size:11px;margin-top:6px">Skeletons mirror final layout — no spinners for &lt;3s waits.</p></div>
    </div></div>
    <div class="card"><div class="card-h"><h3>Voice & micro-interactions</h3></div><div class="card-b" style="font-size:12.5px;display:flex;flex-direction:column;gap:9px">
      <p><b>AI speaks like a colleague.</b> “Don't go below £315” — a recommendation with a reason, an action, and a visible way to decline. Never “As an AI…”.</p>
      <p><b>Motion is 120–180ms, ease-out, purposeful.</b> Page fades + 4px rise; toast slide-up; chip pulse on AI-applied changes; signature draws itself. Respects <span class="num" style="font-size:11px">prefers-reduced-motion</span>.</p>
      <p><b>Every destructive or outward action previews first.</b> Send, move, charge — the AI drafts, the human approves. Trust is the feature.</p>
      <p><b>Keyboard-first:</b> <span class="kbd">⌘K</span> palette · <span class="kbd">G</span>+<span class="kbd">D</span> dashboard · <span class="kbd">G</span>+<span class="kbd">J</span> jobs · <span class="kbd">G</span>+<span class="kbd">S</span> scheduler · <span class="kbd">N</span> new job · <span class="kbd">T</span> theme.</p>
    </div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h3>Iconography</h3><div class="rt"><span class="mut3" style="font-size:11px">16px grid · 1.8px stroke · round caps — drawn for this product, incl. skip & grab-arm glyphs</span></div></div>
    <div class="card-b"><div class="icon-grid">${Object.entries(ICONS).slice(0,24).map(([n,s])=>`<div class="icon-cell">${s}<span>${n}</span></div>`).join('')}</div></div></div>
</div>`;

/* ============ ROUTER / PALETTE / INIT ============ */
let ROUTE='dashboard';
const TITLES={dashboard:'Dashboard',customers:'Customers',customer:'Customers',jobs:'Jobs',quotes:'Quotes',drivers:'Drivers',vehicles:'Vehicles',containers:'Containers',scheduling:'Scheduling',routes:'Route Planner',compliance:'Compliance',invoices:'Invoices',reports:'Reports',documents:'Documents',messages:'Messages',assistant:'AI Assistant',driverapp:'Driver App',design:'Design System',settings:'Settings'};
function go(r){ ROUTE=r; render(); $('#view').scrollTop=0; }
function render(){
  const [base,arg]=ROUTE.split(':');
  $('#view').innerHTML = (SCREENS[base]||SCREENS.dashboard)(arg);
  $('#sidenav').innerHTML = NAV.map(g=>`<div class="grp eyebrow">${g.grp}</div>`+g.items.map(it=>
    `<button class="nav-it ${base===it[0]||(base==='customer'&&it[0]==='customers')?'on':''}" onclick="go('${it[0]}')">${ICONS[it[2]]}<span class="lbl">${it[1]}</span>${it[3]?`<span class="badge">${it[3]}</span>`:''}</button>`).join('')).join('');
  const parentMap={customer:'Customers'};
  $('#crumb').innerHTML = base==='customer'
    ? `<span class="parent" onclick="go('customers')">Customers</span><span class="sep">/</span>${(CUSTOMERS.find(c=>c.id===arg)||CUSTOMERS[0]).name}`
    : TITLES[base]||'Dashboard';
  wireDashDnd(); wireKanban(); wireSched(); drawRouteMaps();
}
/* command palette */
let PAL_SEL=0;
const PAL_ACTIONS=[
  ['Create new quote','quotes','quotes','Action'],['Book a job','jobs','plus','Action'],['Ask the AI assistant','assistant','ai','Action'],
  ['Optimise Friday routes','routes','routes','Action'],['Generate Duty of Care pack','compliance','compliance','Action'],['Toggle dark mode','__theme','zap','Action'],
];
function openPalette(){ $('#pal-overlay').classList.add('open'); const i=$('#pal-input'); i.value=''; PAL_SEL=0; renderPalette(); setTimeout(()=>i.focus(),30); }
function closePalette(){ $('#pal-overlay').classList.remove('open'); }
function palItems(){
  const q=($('#pal-input').value||'').toLowerCase();
  const nav=NAV.flatMap(g=>g.items).map(it=>({t:it[1],go:it[0],ic:it[2],grp:'Go to'}));
  const acts=PAL_ACTIONS.map(a=>({t:a[0],go:a[1],ic:a[2],grp:a[3]}));
  const custs=CUSTOMERS.map(c=>({t:c.name,go:'customer:'+c.id,ic:'customers',grp:'Customers',sub:money(c.spend12m)+' / 12mo'}));
  const jobs=JOBS.slice(0,6).map(j=>({t:j.id+' — '+j.type,go:'jobs',ic:'jobs',grp:'Jobs',sub:j.cust}));
  const inv=INVOICES.slice(0,4).map(i=>({t:i.id+' — '+i.cust,go:'invoices',ic:'invoices',grp:'Invoices',sub:money(i.amount)}));
  let all=[...acts,...nav,...custs,...jobs,...inv];
  if(q) all=all.filter(x=>(x.t+' '+(x.sub||'')+' '+x.grp).toLowerCase().includes(q));
  return all.slice(0,12);
}
function renderPalette(){
  const items=palItems(); PAL_SEL=Math.min(PAL_SEL,Math.max(0,items.length-1));
  let html='',lastGrp='';
  items.forEach((it,i)=>{ if(it.grp!==lastGrp){html+=`<div class="pal-grp">${it.grp}</div>`;lastGrp=it.grp;}
    html+=`<div class="pal-it ${i===PAL_SEL?'sel':''}" onmouseenter="PAL_SEL=${i};renderPalette()" onclick="palGo(${i})">${ICONS[it.ic]||''}<span>${it.t}</span>${it.sub?`<span class="sub num">${it.sub}</span>`:''}</div>`; });
  $('#pal-list').innerHTML = html||'<div class="empty" style="padding:24px"><p>No results — try a customer, job ID or invoice number</p></div>';
}
function palGo(i){ const it=palItems()[i]; if(!it)return; closePalette(); if(it.go==='__theme'){toggleTheme();return;} go(it.go); }
function palKey(e){
  const items=palItems();
  if(e.key==='ArrowDown'){e.preventDefault();PAL_SEL=(PAL_SEL+1)%items.length;renderPalette();}
  else if(e.key==='ArrowUp'){e.preventDefault();PAL_SEL=(PAL_SEL-1+items.length)%items.length;renderPalette();}
  else if(e.key==='Enter'){palGo(PAL_SEL);}
  else if(e.key==='Escape'){closePalette();}
}
/* global keys */
let G_PENDING=false;
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
  if(e.key==='Escape'){closePalette();closeModal();$('#notif-pop').classList.remove('open');return;}
  if(e.target.matches('input,textarea,select'))return;
  if(G_PENDING){ G_PENDING=false;
    const map={d:'dashboard',c:'customers',j:'jobs',q:'quotes',s:'scheduling',r:'routes',i:'invoices',a:'assistant',m:'messages'};
    if(map[e.key.toLowerCase()]){go(map[e.key.toLowerCase()]);return;} }
  if(e.key.toLowerCase()==='g'){G_PENDING=true;setTimeout(()=>G_PENDING=false,900);return;}
  if(e.key.toLowerCase()==='t'){toggleTheme();return;}
  if(e.key.toLowerCase()==='n'){toast('New job created — JOB-2419 added to Unassigned','plus');return;}
});
addEventListener('resize',()=>drawRouteMaps());
render();
</script>
